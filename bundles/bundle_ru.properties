mod.hemera.subtitle = [orange]...[]

# Небесные тела
planet.hemera-hemera.name = Хемера
planet.hemera-hemera.description = Путешественник во времени: пинает камень\nМарс:

# Сектора
sector.hemera-opportunity.name = Опция
sector.hemera-opportunity.description = Идеальное место для начала развития, почти не тронутое врагами.\nИсследуйте выплавку железа и добудьте кварц.
sector.hemera-opportunity.details = "Опционально"

sector.hemera-faultline.name = Разлом
sector.hemera-faultline.description = Зона [accent]сейсмической активности[] с труднопроходимым рельефом. Из-за него враги будут отправлять воздушных юнитов. Выплавьте стекло и исследуйте противовоздушную оборону.
sector.hemera-faultline.details = Причина тряски?

sector.hemera-rusty-expanse.name = Ржавые просторы
sector.hemera-rusty-expanse.description = Большая пустошь с большим количеством песка из ржавчины.\n\nХорошее место чтобы начать производить сталь и исследовать важные технологии чтобы отбить волны врага.
sector.hemera-rusty-expanse.details = Лора здесь нет...

# Учебник по химии core:
## Предметы
item.hemera-rust.name = Ржавчина
item.hemera-rust.description = Гидратированный оксид железа. Используется для выплавки железа и примитивных построек.
item.hemera-rust.details = Самый доступный и распространенный ресурс на Хемере - планета буквально состоит из него

item.hemera-iron.name = Железо
item.hemera-iron.description = Довольно мягкий металл. Используется в базовых структурах, логистике и создании стали.
item.hemera-iron.details = Знай - тут все металлы и виды стали используются для производства стали

item.hemera-quartz.name = Кварц
item.hemera-quartz.description = Диоксид кремния. Используется в электронике, механиках и в качестве боеприпасов. Имеет тот же состав, что и песок.
item.hemera-quartz.details = Пьезоэлектрические свойства?

item.hemera-glass.name = Стекло
item.hemera-glass.description = Инертный прозрачный материал. Используется в жидкостной логистике.

item.hemera-steel.name = Сталь
item.hemera-steel.description = Соединение железа с углеродом (графитом). Твёрже и более устойчиво к коррозии чем железо. Используется в основных продвинутых структурах.

item.hemera-perchlorate.name = Перхлорат
item.hemera-perchlorate.description = Смесь окисляющих солей. Используется в качестве коррозийного боеприпаса и поглотителя воды. Играет роль окислителя в окислительно-восстановительных реакциях.

item.graphite.name = Графит
item.graphite.description = Одна из форм углерода. Используется в электрических компонентах и в качестве боеприпасов. Играет роль восстановителя в окислительно-восстановительных реакциях.

item.hemera-oxidizer.name = Окислитель
item.hemera-oxidizer.description = Смесь окисляющих солей и кислорода. Используется в качестве химического реагента в окислительных реакциях.

item.hemera-chromium.name = Хром
item.hemera-chromium.description = [#aaddff]Отражающий[] и устойчивый к коррозии металл. Используется для создания стали и в качестве химического катализатора.

item.hemera-stainless-steel.name = Нержавеющая сталь
item.hemera-stainless-steel.description =  Сталь с добавлением хрома. Более устойчива к коррозии, чем обычная. Используется в основных продвинутых структурах и для создания более прочных материалов.

item.hemera-uranium.name = Уран
item.hemera-uranium.description = Радиоактивный тяжёлый металл. Может быть обогащён и обеднён для специальных целей.
item.hemera-uranium.details = Доходяги? Да да, ядерка

item.hemera-uranium-depleted.name = Обеднённый уран
item.hemera-uranium-depleted.description = Менее радиоактивный, но не менее тяжёлый металл. Используется для создания стали.
item.hemera-uranium-depleted.details = Он теперь нищий!

item.hemera-uranium-enriched.name = Обогащённый уран
item.hemera-uranium-enriched.description = Очень [acid]радиоактивный[] металл. Используется в ядерной энергетике.
item.hemera-uranium-enriched.details = Обогащённый уран?!

item.hemera-uranium-steel.name = Урановая сталь
item.hemera-uranium-steel.description = Более прочная сталь, чем нержавеющая. Используется для щитов и производства тяжёлой стали.

item.hemera-osmium.name = Осмий
item.hemera-osmium.description = [#441144]Чрезвычайно тяжёлый[] и устойчивый к коррозии металл. Используется для тяжёлой брони, структур и создания стали.
item.hemera-osmium.details = Самый тяжёлый металл в таблице Менделеева как ни как

item.hemera-heavy-steel.name = Тяжёлая сталь
item.hemera-heavy-steel.description = Тяжелейший, прочнейший и коррозийно устойчивейший вид стали на Хемере. НЕ используется для создания стали, а для создания прочнейшей защиты.
item.hemera-heavy-steel.details = Пик стальной металлургии. Стоит на вершине производственной цепочки стали и имеет все их лучшие свойства.

## Флюиды (общее название газов и жидкостей)
liquid.hemera-co2.name = Диоксид углерода
liquid.hemera-co2.description = Самый распространённый газ на Хемере. Используется для создания давления и разделения на углерод (графит) и кислород.

liquid.hemera-oxygen.name = Кислород
liquid.hemera-oxygen.description = Коррозийный и реактивный газ. Используется в качестве окислителя в различных реакциях.

# Ядра
block.hemera-core-drop.name = Ядро: «Перепад»
block.hemera-core-drop.description = Основа базы. Сектор будет потерян при уничтожении. Хранит большое количество энергии.

# Копать
block.hemera-friction-miner.name = Трениевый добыватель
block.hemera-friction-miner.description = Добывает базовые ресурсы из земли с помощью трения.

block.hemera-abrasive-miner.name = Абразивный добыватель
block.hemera-abrasive-miner.description = Добывает ресурсы из земли с помощью кварцевого абразива.

block.hemera-corrosion-miner.name = Коррозийный добыватель
block.hemera-corrosion-miner.description = Добывает ресурсы из земли с помощью окисления земли кислородом.

block.hemera-pressure-miner.name = Давящий добыватель
block.hemera-pressure-miner.description = Добывает ресурсы из земли с помощью давления диоксида углерода.

# Общая логистика
## Предметная
block.hemera-vacuum-pipe.name = Вакуумный конвейер
block.hemera-vacuum-pipe.description = Перемещает предметы. Может хранить немного энергии и передавать её.

block.hemera-reinforced-vacuum-pipe.name = Изолированный вакуумный конвейер
block.hemera-reinforced-vacuum-pipe.description = Перемещает предметы. Может хранить немного энергии и передавать её. Не принимает ввод по бокам.

block.hemera-vacuum-pipe-router.name = Вакуумная стрелка
block.hemera-vacuum-pipe-router.description = Распределяет предметы по сторонам. Хранит немного энергии и передаёт её.

block.hemera-vacuum-pipe-bridge.name = Вакуумный мост
block.hemera-vacuum-pipe-bridge.description = Перемещает предметы над постройками и стенами. Хранит немного энергии.

block.hemera-overflow-vacuum-pipe.name = Вакуумный изобилующий затвор
block.hemera-overflow-vacuum-pipe.description = Распределяет предметы по бокам только если спереди нету места. Хранит немного энергии и передаёт её.

block.hemera-underflow-vacuum-pipe.name = Вакуумный дефицитный затвор
block.hemera-underflow-vacuum-pipe.description = Перемещает предметы вперёд только если по бокам нету места. Хранит немного энергии и передаёт её.

block.hemera-vacuum-unloader.name = Вакуумный уравниватель
block.hemera-vacuum-unloader.description = Уравнивает количество предметов в соседних блоках. Может разгружать ядра. Хранит немного энергии и передаёт её.

block.hemera-buffer.name = Буфер
block.hemera-buffer.description = Хранит предметы и энергию. Вывод предметов может быть осуществлен через уравниватель или боевой единицей. Может расширять хранилище ядра.

## Жидкостная
block.hemera-pipeline.name = Фистула
block.hemera-pipeline.description = Перемещает флюиды вперёд. Хранит немного энергии и передаёт её.
block.hemera-pipeline.details =  Наверное не стоило использовать столько древних терминов...\n\nФистула - от лат. fistula - труба\nФлюиды - от лат. fluidus - текучий. Общий термин для газов и жидкостей

block.hemera-pipeline-junction.name = Фистульный перекрёсток
block.hemera-pipeline-junction.description = Перемещает флюиды по оппозиционным сторонам без смешивания. Хранит немного энергии и передаёт её.

block.hemera-bridge-pipeline.name = Мостовая фистула
block.hemera-bridge-pipeline.description = Перемещает флюиды через препятствия. Хранит немного энергии и передаёт её.

block.hemera-pipeline-router.name = Фистульная ампула
block.hemera-pipeline-router.description = Хранит маленькое количество флюида и перемещает его во все стороны. Хранит немного энергии и передаёт её.

block.hemera-pipeline-container.name = Фистульный сосуд
block.hemera-pipeline-container.description = Хранит большое количество флюида и перемещает его во все стороны. Хранит энергию и передаёт её.

block.hemera-pipeline-tank.name = Фистульный резервуар
block.hemera-pipeline-tank.description = Хранит огромное количество флюида и перемещает его во все стороны. Хранит энергию и передаёт её.

# Заводы
# Ох зря я туда полез...
block.hemera-iron-smelter.name = Железная плавильня
block.hemera-iron-smelter.description = Плавит ржавчину в железо.

block.hemera-iron-crucible.name = Железный тигель
block.hemera-iron-crucible.description = Плавит большие объемы ржавчины в железо. Требует графит в качестве восстановителя.

block.hemera-glass-kiln.name = Стеклоплавильная печь
block.hemera-glass-kiln.description = Выплавляет песок в стекло.

block.hemera-carbon-capture.name = Концентратор диоксида углерода
block.hemera-carbon-capture.description = Получает диоксид углерода из атмосферы.

block.hemera-carbon-electrolyzer.name = Углеродный электролизер
block.hemera-carbon-electrolyzer.description = Преобразует диоксид углерода в кислород и графит.

block.hemera-silicon-refiner.name = Восстановитель кремния
block.hemera-silicon-refiner.description = Восстанавливает кремний из песка. Требует графит в качестве восстановителя. Производит диоксид углерода в качестве побочного продукта.

block.hemera-dehumidifier.name = Осушитель воздуха
block.hemera-dehumidifier.description = Поглощает воду из атмосферы с помощью перхлората магния.

block.hemera-oxidizer-mixer.name = Смеситель окислителя
block.hemera-oxidozer-mixer.description = Смешивает перхлорат магния с кислородом для получения окислителя.

block.hemera-avlis-plant.name = Лазерный сепаратор изотопов
block.hemera-avlis-plant.description = Разделяет изотопы урана на обогащённый и обеднённый.
block.hemera-avlis-plant.details = Использует лазеры для движения изотопов с разной стабильностью в разные стороны.

block.hemera-steel-foundry.name = Сталелитейный завод
block.hemera-steel-foundry.description = Плавит железо с добавлением графита, получая сталь.

block.hemera-stainless-steel-foundry.name = Плавильня нержавеющей стали
block.hemera-stainless-steel-foundry.description = Плавит железо с добавлением графита и хрома, получая нержавеющую сталь.

block.hemera-uranium-steel-forge.name = Кузница урановой стали
block.hemera-uranium-steel-forge.description = Добавляет в нержавеющую сталь обеднённый уран, получая урановую сталь.

block.hemera-heavy-steel-forge.name = Кузница тяжёлой стали
block.hemera-heavy-steel-forge.description = Плавит урановую сталь с осмием и кремнием, получая тяжёлую сталь.
## Зачем там окислитель и кислород? Они не являются источниками энергии, а образование ржавчины из-за окисления железа в условиях кузницы наоборот будет забирать энергию

# Энергосеть (хотя весь контент это и так энергосеть)
## Генерация энергии
block.hemera-small-windmill.name = Маленький ветряной генератор
block.hemera-small-windmill.description = Беспрерывно генерирует маленькое количество энергии от ветра.
block.hemera-small-windmill.details = Преобразование механического воздействия в энергию это самый простой и интуитивно понятный способ получения энергии из чего либо - турбину будут крутить газы из жерла, водяной пар от сжигания горючих веществ или просто ветер...

block.hemera-medium-windmill.name = Средний ветряной генератор
block.hemera-medium-windmill.description = Беспрерывно генерирует энергию от ветра.

block.hemera-small-photovoltaic-cell.name = Маленькая фотоэлектрическая солнечная панель
block.hemera-small-photovoltaic-cell.description = Беспрерывно генерирует небольшое количество энергии от солнца. Генерирует больше энергии, чем ветряной вариант, но не работает ночью.
block.hemera-small-photovoltaic-cell.details = Другой способ получения энергии - преобразование света напрямую в электричество. Не требует сложной конструкции и движущихся элементов, но требует кремний для создания

block.hemera-large-photovoltaic-cell.name = Большая фотоэлектрическая солнечная панель
block.hemera-large-photovoltaic-cell.description = Беспрерывно генерирует большое количество энергии от солнца. Генерирует больше энергии, чем ветряной вариант, но не работает ночью.

block.hemera-nuclear-reactor.name = Ядерный реактор
block.hemera-nuclear-reactor.description = Генерирует огромное количество энергии из реакции деления урана. Перегревается и взрывается если не охлаждён водой.
block.hemera-nuclear-reactor.details = Ториевый реактор reference???

## Энергетическая логистика
block.hemera-power-pylon.name = Энергоузел
block.hemera-power-pylon.description = Передаёт энергию на маленькие расстояния по воздуху.
block.hemera-power-pylon.details = Физики здесь нет - только чистая игровая условность

# Турели
block.hemera-fracture.name = Дробь
block.hemera-fracture.description = Стреляет снарядами по наземным целям с небольшим разбросом.
block.hemera-fracture.hemera-quartz.info = Средний урон на любой дистанции.
block.hemera-fracture.hemera-rust.info = Маленький урон на любой дистанции.

block.hemera-hurl.name = Кидатель
block.hemera-hurl.description = Стреляет медленными снарядами по навесной траектории по наземным врагам.
block.hemera-hurl.graphite.info = Большой урон.
block.hemera-hurl.hemera-perchlorate.info = Огромный урон.\nНакладывает коррозию.

block.hemera-shrapnel.name = Шрапнель
block.hemera-shrapnel.description = Стреляет пучками взрывных снарядов по воздушным врагам.
block.hemera-shrapnel.hemera-glass.info = Средний урон с большим радиусом взрыва.
block.hemera-shrapnel.hemera-iron.info = Маленький урон с средним радиусом взрыва.
block.hemera-shrapnel.hemera-perchlorate.info = Большой урон с средним радиусом взрыва.\nНакладывает коррозию.

# Единицы
# Эукариоты (букв. ядерные организмы)
unit.hemera-ambition.name = Амбиция
unit.hemera-ambition.description = Защищает ядро: «Перепад». Может исцелять союзные постройки, строить и добывать ресурсы.

# Ползающие ультрабыстрые тапки
unit.hemera-hunt.name = Охота
unit.hemera-hunt.description = Стреляет стандартными снарядами по врагам.

unit.hemera-ambush.name = Засада
unit.hemera-ambush.description = Стреляет маленькими ракетами по врагам.

# Летающие бесячие тапки
unit.hemera-stalk.name = Подкрадывание
unit.hemera-stalk.description = Стреляет стандартными снарядами по врагам. Может летать.