# Информация о моде (джава скрип)
mod.hemera.name = [orange]Хемера[]
mod.hemera.author = SomeoneElse
mod.hemera.description = Добавляет новую красную планету - [orange]Хемера[] (вдохновлённую Марсом (который батончик)), на которой есть реалистичная химия, бесконечное количество заводов и множество ресурсов украденных из учебника по химии\n[accent]Помощь: Кселирит - Русский перевод[]
mod.hemera.subtitle = [orange]Односторонние планы...[]

# Небесные тела
planet.hemera-hemera.name = Хемера
planet.hemera-hemera.description = Путешественник во времени: пинает камень\nМарс:

# Сектора
sector.hemera-opportunity.name = Опция
sector.hemera-opportunity.description = Идеальное место для начала развития, почти не тронутое врагами.\nИсследуйте выплавку железа и добудьте кварц.
sector.hemera-opportunity.details = Это название просто имба!

sector.hemera-faultline.name = Разлом
sector.hemera-faultline.description = Длинная долина, созданная мощными тектоническими активностями.\nПодготовтесь к атаке воздушных юнитов и исследуйте соответствующие способы обороны.
sector.hemera-faultline.details = Враг адаптировался к труднопроходимой местности и начал использовать воздушных юнитов. (воздуханство)

sector.hemera-rusty-expanse.name = Ржавые просторы
sector.hemera-rusty-expanse.description = Большая пустошь с большим количеством песка из ржавчины.\n\nХорошее место чтобы начать производить сталь и исследовать necessary технологии чтобы отбить волны врага.
sector.hemera-rusty-expanse.details = Лора здесь нет...

# Учебник по химии core:
# Ветка железа
item.hemera-rust.name = Ржавчина
item.hemera-rust.description = Гидратированный оксид железа. Используется для выплавки железа и примитивных построек.
item.hemera-rust.details = Самый доступный и распространенный ресурс на Хемере - планета буквально состоит из него

item.hemera-iron.name = Железо
item.hemera-iron.description = Довольно мягкий металл. Используется в базовых структурах и логистике.

item.hemera-steel.name = Сталь
item.hemera-steel.description = Соединение железа с углеродом (графитом). Твёрже и более устойчиво к коррозии чем железо. Используется в основных продвинутых структурах.

item.hemera-stainless-steel.name = Нержавеющая сталь
item.hemera-stainless-steel.description =  Сталь с добавлением хрома. Более устойчиво к коррозии, чем обычная. Используется в основных продвинутых структурах и для создания более прочных материалов.

# Ветка кварца
item.hemera-quartz.name = Кварц
item.hemera-quartz.description = Диоксид кремния. Используется в электронике, механиках и в качестве боеприпасов. Имеет тот же состав, что и песок.
item.hemera-quartz.details = Пьезоэлектрические свойства?

item.hemera-glass.name = Стекло
item.hemera-glass.description = Инертный прозрачный материал. Используется в жидкостной логистике.

# Ядра
block.hemera-core-drop.name = Ядро: «Перерад»
block.hemera-core-drop.description = Основа базы. Сектор будет потерян при уничтожении. Хранит большое количество энергии.

# Общая логистика
block.hemera-vacuum-pipe.name = Вакуумный конвейер
block.hemera-vacuum-pipe.description = Перемещает предметы. Может хранить немного энергии и передавать её.

block.hemera-reinforced-vacuum-pipe.name = Экранированный вакуумный конвейер
block.hemera-reinforced-vacuum-pipe.description = Перемещает предметы. Может хранить немного энергии и передавать её. Не принимает ввод по бокам.

block.hemera-vacuum-pipe-router.name = Вакуумный маршрутизатор
block.hemera-vacuum-pipe-router.description = Распределяет предметы по сторонам. Хранит немного энергии и передаёт её.

block.hemera-vacuum-pipe-bridge.name = Вакуумный мост
block.hemera-vacuum-pipe-bridge.description = Перемещает предметы над постройками и стенами. Хранит немного энергии.

block.hemera-overflow-vacuum-pipe.name = Вакуумный изобилующий затвор
block.hemera-overflow-vacuum-pipe.description = Распределяет предметы по бокам только если спереди нету места. Хранит немного энергии и передаёт её.

block.hemera-underflow-vacuum-pipe.name = Вакуумный дефицитный затвор
block.hemera-underflow-vacuum-pipe.description = Перемещает предметы вперёд только если по бокам нету места. Хранит немного энергии и передаёт её.

block.hemera-vacuum-unloader.name = Вакуумный уравниватель
block.hemera-vacuum-unloader.description = Уравнивает количество предметов в соседних блоках. Может разгружать ядра. Хранит немного энергии и передаёт её.

# Заводы
# Ох зря я туда полез...

# Энергосеть (хотя весь контент это и так энергосеть)
block.hemera-small-windmill.name = Маленький ветряной генератор
block.hemera-small-windmill.description = Беспрерывно генерирует маленькое количество энергии от ветра.
block.hemera-small-windmill.details = Преобразование механического воздействия в энергию это самый простой и интуитивно понятный способ получения энергии из чего либо - турбину будут крутить газы из жерла, водяной пар от сжигания горючих веществ или просто ветер...

block.hemera-medium-windmill.name = Средний ветряной генератор
block.hemera-medium-windmill.description = Беспрерывно генерирует энергию от ветра.

block.hemera-power-pylon.name = Энергоузел
block.hemera-power-pylon.description = передаёт энергию на маленькие расстояния по воздуху.

block.hemera-small-photovoltaic-cell.name = Маленькая фотоэлектрическая солнечная панель
block.hemera-small-photovoltaic-cell.description = Беспрерывно генерирует небольшое количество энергии от солнца. Генерирует больше энергии, чем ветряной вариант, но не работает ночью.
block.hemera-small-photovoltaic-cell.details = Другой способ получения энергии - преобразование света напрямую в электричество. Не требует сложной конструкции и движущихся элементов, но требует кремний для создания

block.hemera-large-photovoltaic-cell.name = Большая фотоэлектрическая солнечная панель
block.hemera-large-photovoltaic-cell.description = Беспрерывно генерирует большое количество энергии от солнца. Генерирует больше энергии, чем ветряной вариант, но не работает ночью.

# Турели
block.hemera-fracture.name = Дробь
block.hemera-fracture.description = Стреляет снарядами с небольшим разбросом.
block.hemera-fracture.hemera-quartz.info = Средний урон на любой дистанции.
block.hemera-fracture.hemera-rust.info = Маленький урон на любой дистанции.

block.hemera-hurl.name = Кидатель
block.hemera-hurl.description = Стреляет медленными снарядами по навесной траектории по наземным врагам.
block.hemera-hurl.graphite.info = Большой урон.
block.hemera-hurl.hemera-perchlotare.info = Огромный урон.\nНакладывает коррозию.

block.hemera-shrapnel.name = Шрапнель
block.hemera-shrapnel.description = Стреляет пучками взрывных снарядов.
block.hemera-shrapnel.hemera-glass.info = Средний урон с большим радиусом взрыва.
block.hemera-shrapnel.hemera-iron.info = Маленький урон с средним радиусом взрыва.
block.hemera-shrapnel.hemera-perchlorate.info = Большой урон с средним радиусом взрыва.\nНакладывает коррозию

# Единицы
# Эукариоты (букв. ядерные организмы)
unit.hemera-ambition.name = Амбиция
unit.hemera-ambition.description = Защищает ядро: «перепад». Может исцелять союзные постройки, строить и добывать ресурсы.

# Ползающие ультрабыстрые тапки
unit.hemera-hunt.name = Охота
unit.hemera-hunt.description = Стреляет стандартными снарядами по врагам.

unit.hemera-ambush.name = Засада
unit.hemera-ambush.description = Стреляет маленькими ракетами по врагам.

# Летающие бесячие тапки
unit.hemera-stalk.name = Подкрадывание
unit.hemera-stalk.description = Стреляет стандартными снарядами по врагам. Может летать.