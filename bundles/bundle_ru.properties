# Перевод от Кселирита (oscillatorium на гитхабе)
# Translation from Xelirit (oscillatorium on GitHub)

# items
item.hemera-rust.name = Ржавчина
item.hemera-rust.description = Гидратированный оксид железа. Используется для производства железа и базовой генерации энергии.

item.hemera-quartz.name = Кварц
item.hemera-quartz.description = Диоксид кремния. Используется в электронике, механиках и в качестве абразивных боеприпасов. Может быть разрушен в песок.

item.hemera-iron.name = Железо
item.hemera-iron.description = Довольно мягкий металл. Используется в базовых структурах и логистике.

# cores
block.hemera-core-drop.name = Ядро: «перепад»
block.hemera-core-drop.description = Ядро базы. Сектор будет потерян при уничтожении.

# distribution
block.hemera-vacuum-pipe.name = Вакуумный конвейер
block.hemera-vacuum-pipe.description = Перемещает предметы. Может хранить немного энергии и передавать её.

block.hemera-reinforced-vacuum-pipe.name = Экранированный вакуумный конвейер
block.hemera-reinforced-vacuum-pipe.description = Перемещает предметы. Может хранить немного энергии и передавать её. Не принимает ввод по бокам.

block.hemera-vacuum-pipe-router.name = Вакуумный маршрутизатор
block.hemera-vacuum-pipe-router.description = Распределяет предметы по сторонам. Хранит немного энергии и передаёт её.

block.hemera-vacuum-pipe-bridge.name = Вакуумный мост
block.hemera-vacuum-pipe-bridge.description = Перемещает предметы над постройками и стенами. Хранит немного энергии.

block.hemera-overflow-vacuum-pipe.name = Вакуумный изобилующий затвор
block.hemera-overflow-vacuum-pipe.description = Распределяет предметы по бокам только если спереди нету места. Хранит немного энергии и передаёт её.

block.hemera-underflow-vacuum-pipe.name = Вакуумный дефицитный затвор
block.hemera-underflow-vacuum-pipe.description = Перемещает предметы вперёд только если по бокам нету места. Хранит немного энергии и передаёт её.

block.hemera-vacuum-unloader.name = Вакуумный уравниватель
block.hemera-vacuum-unloader.description = Уравнивает количество предметов в соседних блоках. Может разгружать ядра. Хранит немного энергии и передаёт её.

# power
block.hemera-small-windmill.name = Маленький ветряной генератор
block.hemera-small-windmill.description = Беспрерывно генерирует маленькое количество энергии от ветра.

block.hemera-medium-windmill.name = Средний ветряной генератор
block.hemera-medium-windmill.description = Беспрерывно генерирует энергию от ветра

block.hemera-power-pylon.name = Энергоузел
block.hemera-power-pylon.description = передаёт энергию на маленькие расстояния по воздуху.

block.hemera-small-photovoltaic-cell.name = Маленькая фотоэлектрическая солнечная панель
block.hemera-small-photovoltaic-cell.description = Беспрерывно генерирует небольшое количество энергии от солнца. Генерирует больше энергии, чем ветряной вариант, но не работает ночью.

block.hemera-large-photovoltaic-cell.name = Большая фотоэлектрическая солнечная панель
block.hemera-large-photovoltaic-cell.description = Беспрерывно генерирует большое количество энергии от солнца. Генерирует больше энергии, чем ветряной вариант, но не работает ночью.

# turrets
block.hemera-fracture.name = Дробь
block.hemera-fracture.description = Стреляет снарядами с небольшим разбросом.
block.hemera-fracture.hemera-quartz.info = Средний урон на любой дистанции.
block.hemera-fracture.hemera-rust.info = Маленький урон на любой дистанции.

block.hemera-hurl.name = Кидатель
block.hemera-hurl.description = Стреляет медленными снарядами по навесной траектории по наземным врагам.
block.hemera-hurl.graphite.info = Большой урон.
block.hemera-hurl.hemera-perchlotare.info = Огромный урон.\nНакладывает коррозию.

block.hemera-shrapnel.name = Шрапнель
block.hemera-shrapnel.description = Стреляет пучками взрывных снарядов.
block.hemera-shrapnel.hemera-glass.info = Средний урон с большим радиусом взрыва.
block.hemera-shrapnel.hemera-iron.info = Маленький урон с средним радиусом взрыва.
block.hemera-shrapnel.hemera-perchlorate.info = Большой урон с средним радиусом взрыва.\nНакладывает коррозию

# units
unit.hemera-ambition.name = Амбиция
unit.hemera-ambition.description = Защищает ядро: «перепад». Может исцелять союзные постройки, строить и добывать ресурсы.