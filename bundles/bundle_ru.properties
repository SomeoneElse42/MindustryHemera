// items
item.hemera-rust.name = Ржавчина
item.hemera-rust.description = Гидратированный оксид железа. Используется для производства железа и базовой генерации энергии.

item.hemera-quartz.name = Кварц
item.hemera-quartz.description = Диоксид кремния. Используется в электронике, механиках и в качестве абразивных боеприпасов. Может быть разрушен в песок.

item.hemera-iron.name = Железо
item.hemera-iron.description = Довольно мягкий металл. Используется в базовых структурах и логистике.
// cores
block.hemera-core-drop.name = Ядро: «перепад»
block.hemera-core-drop.description = Ядро базы. Сектор будет потерян при уничтожении.

// distribution
block.hemera-vacuum-pipe.name = Вакуумный  конвейер
block.hemera-vacuum-pipe.description = Перемещает предметы. Может хранить немного энергии и передавать её.

block.hemera-vacuum-pipe-router.name = Вакуумный маршрутизатор
block.hemera-vacuum-pipe-router.description = Распределяет предметы по сторонам.

block.hemera-vacuum-pipe-bridge.name = Вакуумный мост
block.hemera-vacuum-pipe-bridge.description = Перемещает предметы над постройками и стенами.

block.hemera-overflow-vacuum-pipe.name = Вакуумный изобилующий затвор
block.hemera-overflow-vacuum-pipe.description = Распределяет предметы по бокам только если спереди нету места.

block.hemera-underflow-vacuum-pipe.name = Вакуумный дефицитный затвор
block.hemera-underflow-vacuum-pipe.description = Перемещает предметы вперёд только если по бокам нету места.

// units
unit.hemera-ambition.name = Амбиция
unit.hemera-ambition.description = Защищает ядро: «перепад». Может исцелять союзные постройки, строить и добывать ресурсы 