## fluids
### потому что прикольно и возможно немного поучительно
block.hemera-pipeline.name = Fistula
block.hemera-pipeline.description = Moves fluids forward. Transmits energy.
block.hemera-pipeline.details = Probably shouldn't have used so many ancient terms...\n\nFistula - from Latin - pipe\nFluids - from Latin fluidus - flowing. A general term for gases and liquids

block.hemera-pipeline-junction.name = Fistula Junction
block.hemera-pipeline-junction.description = Moves fluids along opposite sides without mixing. Stores a bit of energy and transmits it.

block.hemera-bridge-pipeline.name = Bridge Fistula
block.hemera-bridge-pipeline.description = Moves fluids through obstacles. Stores a bit of energy and transmits it.

block.hemera-pipeline-router.name = Fistula Ampoule
block.hemera-pipeline-router.description = Stores a small amount of fluid and moves it in all directions. Stores a bit of energy and transmits it.

block.hemera-pipeline-container.name = Fistula Vessel
block.hemera-pipeline-container.description = Stores a large amount of fluid and moves it in all directions. Stores energy and transmits it.

block.hemera-pipeline-tank.name = Fistula Reservoir
block.hemera-pipeline-tank.description = Stores a huge amount of fluid and moves it in all directions. Stores energy and transmits it.